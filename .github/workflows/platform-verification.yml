name: Platform verification
on:
  push:
    branches: [platform-verification-bc99e14]
permissions:
  contents: read
jobs:
  native:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig 0.16.0
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform, tarfile, urllib.request
          arch = {'arm64':'aarch64', 'amd64':'x86_64'}.get(platform.machine().lower(), platform.machine().lower())
          system = {'Darwin':'macos', 'Linux':'linux'}[platform.system()]
          entry = json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))['0.16.0'][arch + '-' + system]
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zig.tar.xz'
          urllib.request.urlretrieve(entry['tarball'], archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == entry['shasum']
          with tarfile.open(archive) as file:
              folder = file.getmembers()[0].name.split('/')[0]
              file.extractall(archive.parent, filter='data')
          with open(os.environ['GITHUB_PATH'], 'a') as file:
              file.write(str(archive.parent / folder) + '\n')
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make autoconf automake libtool pkg-config libsqlite3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev wayland-protocols
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config cmake sqlite
          echo "$(brew --prefix sqlite)/lib" >> "$GITHUB_PATH"
      - name: Record environment
        run: |
          uname -a
          python3 --version
          zig version
          cc --version
          git rev-parse HEAD
          if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; xcrun --show-sdk-path; fi
      - name: Formatting
        run: |
          python3 -m pip install clang-format==22.1.8
          python3 tools/format.py --check
      - name: Native dependencies with Ubuntu library path workaround
        shell: python
        run: |
          import pathlib, subprocess, sys
          library = pathlib.Path('.deps/install/linux-x86_64/lib')
          for attempt in range(3):
              result = subprocess.run([sys.executable, 'build/driver.py', 'deps', '--summary', 'all'])
              if result.returncode == 0:
                  break
              recovered = 0
              for source in (library / 'x86_64-linux-gnu').glob('*.so*'):
                  target = library / source.name
                  if not target.exists():
                      target.symlink_to(source.relative_to(library))
                      print('Temporary dependency layout workaround:', target, flush=True)
                      recovered += 1
              if not recovered:
                  sys.exit(result.returncode)
          else:
              sys.exit(1)
      - name: Build
        run: python3 build/driver.py --summary all
      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 build/driver.py test --summary all 2>&1 | tee regressions.log
      - name: Require all macOS tests to run
        if: runner.os == 'macOS'
        shell: python
        run: |
          import pathlib, re, subprocess, sys
          summary = pathlib.Path('regressions.log').read_text()
          counts = re.search(r'(\d+)/(\d+) tests passed', summary)
          assert counts and counts[1] == counts[2], summary
          code = "import unittest,sys; suite=unittest.defaultTestLoader.discover('build',pattern='*_test.py'); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)"
          subprocess.run([sys.executable, '-c', code], check=True)
      - name: Fixture smoke render in both themes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          SDL_VIDEODRIVER=dummy ./zig-out/bin/spica --fixture resource --data-dir "$RUNNER_TEMP/spica-dark" --capture "$PWD/smoke/dark.png" --quit-after 1200
          SDL_VIDEODRIVER=dummy ./zig-out/bin/spica --fixture resource --data-dir "$RUNNER_TEMP/spica-light" --light --capture "$PWD/smoke/light.png" --quit-after 1200
          test -s smoke/dark.png
          test -s smoke/light.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            regressions.log
            smoke/*.png
  windows:
    if: false
    name: Native Windows build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Zig 0.16.0
        shell: python
        run: |
          import hashlib, json, os, pathlib, urllib.request, zipfile
          entry = json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))['0.16.0']['x86_64-windows']
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zig.zip'
          urllib.request.urlretrieve(entry['tarball'], archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == entry['shasum']
          with zipfile.ZipFile(archive) as file:
              folder = file.namelist()[0].split('/')[0]
              file.extractall(archive.parent)
          with open(os.environ['GITHUB_PATH'], 'a') as file:
              file.write(str(archive.parent / folder) + '\n')
      - name: Native build
        run: zig build --summary all
      - name: Native regressions
        if: always()
        run: zig build test --summary all
